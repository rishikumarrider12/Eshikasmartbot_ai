<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eshika SmartBot AI</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
  <div id="splash-screen" class="splash-screen">
    <div class="splash-content">
      <img src="logo.png" alt="Eshika Logo" class="splash-logo" />
      <h1 class="splash-title">Eshika SmartBot AI</h1>
      <p class="splash-subtitle">Your Intelligent Multilingual Companion</p>
      <div class="splash-credits">
        <p><strong>CEO & Founder of Eshika:</strong> P Raghu Varma</p>
        <p class="founder-highlight"><strong>Founder of Eshika Smartbot:</strong> N Rishikumar (Son of N Chiranjeevi)
        </p>
        <p><em>Developed by Eshika Developers Team</em></p>
      </div>
      <button id="get-started-btn" class="get-started-btn">Get Started</button>
    </div>
  </div>

  <div class="app-container">
    <header class="header">
      <div class="header-left">
        <img src="logo.png" alt="Logo" class="bot-logo" />
        <h1>Eshika AI</h1>
      </div>
      <div class="header-right">
        <select id="language-select" class="control-btn">
          <option value="en-US">English</option>
          <option value="te-IN">Telugu</option>
          <option value="hi-IN">Hindi</option>
        </select>
        <select id="voice-select" class="control-btn">
          <option value="female">Female</option>
          <option value="male">Male</option>
        </select>
        <button onclick="clearChat()" class="control-btn" title="Clear Chat">🗑️</button>
        <button id="mute-btn" class="control-btn">🔊</button>
        <div class="tagline">
          <p class="founder-tag">Founder: <strong>N Rishikumar (Son of N Chiranjeevi)</strong></p>
        </div>
      </div>
    </header>
    <main class="chat-area" id="chat-area"></main>
    <div id="typing-indicator" class="typing-indicator">Eshika is thinking...</div>
    <div class="input-panel">
      <textarea id="user-input" rows="1" placeholder="Type your message..."></textarea>
      <button id="send-btn">➤</button>
      <button id="voice-input-btn">🎤</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
